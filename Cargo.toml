[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/sandbox",
    "crates/vcs",
    "crates/promotion",
    "crates/templates",
    "crates/skills",
    "crates/tools",
    "crates/harness",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
nucleus-core = { path = "crates/core" }
nucleus-sandbox = { path = "crates/sandbox" }
nucleus-vcs = { path = "crates/vcs" }
nucleus-promotion = { path = "crates/promotion" }
nucleus-templates = { path = "crates/templates" }
nucleus-skills = { path = "crates/skills" }
nucleus-tools = { path = "crates/tools" }
nucleus-harness = { path = "crates/harness" }

anyhow = "1"
async-trait = "0.1"
bollard = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
gix = { version = "0.89", default-features = false, features = ["revision", "blob-diff", "max-performance-safe", "sha1"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Keep debug builds small: line tables are enough for backtraces, dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
